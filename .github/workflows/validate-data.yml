name: Validate procurement data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
      - run: python scripts/build_data_bundle.py
