name: Import manual price submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to import"
        required: true
        type: number

permissions:
  contents: write
  issues: write

concurrency:
  group: manual-price-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[价格提交]') ||
      contains(github.event.issue.body, 'pc-price-submission:v1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve issue number
        id: issue
        env:
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          number="${EVENT_ISSUE:-$INPUT_ISSUE}"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Fetch issue event payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          python - <<'PY'
          import json
          from pathlib import Path
          issue = json.loads(Path('/tmp/issue.json').read_text(encoding='utf-8'))
          Path('/tmp/import-event.json').write_text(
              json.dumps({'issue': issue}, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Import structured price
        id: import
        run: |
          set +e
          output=$(python scripts/import_price_issue.py --event /tmp/import-event.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          {
            echo "message<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Validate and rebuild
        run: |
          python scripts/validate_data.py
          python scripts/build_data_bundle.py

      - name: Commit imported price
        id: commit
        run: |
          if git diff --quiet -- data/snapshots.json data-bundle.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data-bundle.js
          git commit -m "Import manual price from issue #${{ steps.issue.outputs.number }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment and close successful submission
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            message="价格已验证并导入 data/snapshots.json，浏览器数据包也已重新生成。个人结算价已标记为 personal-checkout。"
          else
            message="该价格记录已经存在，未产生重复数据。"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$message"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Explain invalid submission
        if: failure() && steps.import.outputs.message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ERROR_TEXT: ${{ steps.import.outputs.message }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "自动导入失败，请修正 Issue 后重新保存：\n\n\`\`\`text\n${ERROR_TEXT}\n\`\`\`"
